<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIST PMS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved appearance before first paint (see src/theme.js).
      (function () {
        var root = document.documentElement;
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var a = JSON.parse(localStorage.getItem('pms-dashboard:appearance-applied') || 'null');
          var legacy = localStorage.getItem('pms-dashboard:theme');
          if (!a && legacy) a = { theme: legacy, mode: legacy };
          if (a && a.theme) {
            root.dataset.theme = a.theme;
            root.dataset.mode = a.mode;
            if (a.bg) {
              root.style.setProperty('--glass-bg', a.bg);
              root.style.setProperty('--glass-blur', a.blur + 'px');
            }
            return;
          }
        } catch (e) {}
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.mode = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
